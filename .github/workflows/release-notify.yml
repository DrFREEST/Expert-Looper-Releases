name: Release changelog notification
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-changelog-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m pip install Pillow==12.1.1
      - name: Announce release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          DISCORD_DOWNLOAD_WEBHOOK: ${{ secrets.DISCORD_DOWNLOAD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/release_discord.py
